name: Collect M4 result

on:
  push:
    paths:
      - command.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for local agent result
        env:
          M4_TUNNEL_URL: ${{ vars.M4_TUNNEL_URL }}
        run: |
          set -euo pipefail
          if [ -z "${M4_TUNNEL_URL:-}" ]; then
            echo 'M4_TUNNEL_URL is not set'
            exit 1
          fi

          base="${M4_TUNNEL_URL%/}"
          id=$(jq -r '.id' command.json)
          action=$(jq -r '.action // "run"' command.json)
          cmd=$(jq -r '.cmd // "info"' command.json)

          echo "waiting for id=$id action=$action cmd=$cmd"
          ok=0
          for i in $(seq 1 60); do
            echo "poll $i/60"
            if curl -fsS --max-time 10 "$base/api/remote_result_public" -o /tmp/m4.json; then
              cat /tmp/m4.json
              rid=$(jq -r '.remote.id // 0' /tmp/m4.json)
              status=$(jq -r '.remote.status // ""' /tmp/m4.json)
              if [ "$rid" = "$id" ] && [ "$status" != "running" ]; then
                jq '.remote' /tmp/m4.json > result.json
                ok=1
                break
              fi
            fi
            sleep 3
          done

          if [ "$ok" != "1" ]; then
            echo "Timed out waiting for id=$id"
            exit 1
          fi

      - name: Commit result
        run: |
          git config user.name "m4-lab-bot"
          git config user.email "m4-lab-bot@users.noreply.github.com"
          git add result.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            id=$(jq -r '.id' command.json)
            git commit -m "result: command $id"
            git push
          fi
