name: Execute M4 command

on:
  push:
    paths:
      - command.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute command on ESP32
        env:
          M4_TUNNEL_URL: ${{ vars.M4_TUNNEL_URL }}
          M4_API_KEY: ${{ secrets.M4_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${M4_TUNNEL_URL:-}" ]; then
            echo 'M4_TUNNEL_URL is not set'
            exit 1
          fi
          if [ -z "${M4_API_KEY:-}" ]; then
            echo 'M4_API_KEY secret is not set'
            exit 1
          fi

          base="${M4_TUNNEL_URL%/}"
          id=$(jq -r '.id' command.json)
          action=$(jq -r '.action // "run"' command.json)
          cmd=$(jq -r '.cmd // "info"' command.json)
          firmware=$(jq -r '.firmware // "latest.hex"' command.json)

          echo "id=$id action=$action cmd=$cmd firmware=$firmware"

          rc=0
          case "$action" in
            run)
              curl -fsS --max-time 120 -G \
                --data-urlencode "key=$M4_API_KEY" \
                --data-urlencode "cmd=$cmd" \
                "$base/api/run" > /tmp/esp.json || rc=$?
              ;;

            reset)
              curl -fsS --max-time 30 -G \
                --data-urlencode "key=$M4_API_KEY" \
                "$base/api/reset" > /tmp/esp.json || rc=$?
              ;;

            flashrun)
              if [ ! -f "$firmware" ]; then
                echo "Firmware file not found: $firmware"
                rc=90
                printf '{"ok":false,"error":"firmware file not found"}\n' > /tmp/esp.json
              else
                echo "Uploading $firmware"
                curl -fsS --max-time 120 -X POST \
                  --data-binary "@$firmware" \
                  "$base/api/upload?key=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["M4_API_KEY"], safe=""))')&name=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$firmware")" \
                  > /tmp/upload.json || rc=$?

                if [ "$rc" = "0" ]; then
                  cat /tmp/upload.json
                  curl -fsS --max-time 300 -G \
                    --data-urlencode "key=$M4_API_KEY" \
                    --data-urlencode "cmd=$cmd" \
                    "$base/api/flashrun" > /tmp/esp.json || rc=$?
                else
                  cp /tmp/upload.json /tmp/esp.json 2>/dev/null || printf '{"ok":false,"error":"upload failed"}\n' > /tmp/esp.json
                fi
              fi
              ;;

            *)
              rc=91
              printf '{"ok":false,"error":"unknown action"}\n' > /tmp/esp.json
              ;;
          esac

          if [ ! -s /tmp/esp.json ]; then
            printf '{"ok":false,"error":"empty response"}\n' > /tmp/esp.json
          fi

          jq -n \
            --argjson id "$id" \
            --arg action "$action" \
            --arg cmd "$cmd" \
            --argjson rc "$rc" \
            --slurpfile response /tmp/esp.json \
            '{id:$id, action:$action, cmd:$cmd, transport_rc:$rc, response:$response[0]}' \
            > result.json

          cat result.json

      - name: Commit result
        run: |
          git config user.name "m4-lab-bot"
          git config user.email "m4-lab-bot@users.noreply.github.com"
          git add result.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            id=$(jq -r '.id' command.json)
            git commit -m "result: command $id"
            git push
          fi
