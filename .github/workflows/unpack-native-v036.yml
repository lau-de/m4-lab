name: unpack-native-v036

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unpack-native-v036.yml'
      - 'native/audi_concert_ra4m1_native_c_v0_36.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack v0.36 source tree
        run: |
          rm -rf native/audi_concert_ra4m1_native_c_v0_36
          mkdir -p native/audi_concert_ra4m1_native_c_v0_36
          unzip -q native/audi_concert_ra4m1_native_c_v0_36.zip -d /tmp/v036
          cp -a /tmp/v036/audi_concert_ra4m1_native_c_v0_36/. native/audi_concert_ra4m1_native_c_v0_36/
      - name: Generate integration report
        run: |
          ROOT=native/audi_concert_ra4m1_native_c_v0_36
          REPORT=native/v036_integration_report.txt
          {
            echo '=== TREE ==='
            find "$ROOT" -maxdepth 3 -type f | sort
            echo
            echo '=== MAKEFILES ==='
            find "$ROOT" -maxdepth 3 -type f \( -name 'Makefile*' -o -name '*.mk' \) -print -exec sh -c 'echo "--- $1"; sed -n "1,220p" "$1"' _ {} \;
            echo
            echo '=== AUDIO / I2C / TDA / MAIN REFERENCES ==='
            grep -RniE 'TDA7342|TDA|I2C|I²C|audio|main\(|PA6|PA7|PORTA|SDA|SCL' "$ROOT" --include='*.c' --include='*.h' --include='Makefile*' || true
          } > "$REPORT"
      - name: Commit extracted tree
        run: |
          git config user.name 'm4-lab-bot'
          git config user.email 'm4-lab-bot@users.noreply.github.com'
          git add native/audi_concert_ra4m1_native_c_v0_36 native/v036_integration_report.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'unpack native RA4M1 port v0.36'
          git push
